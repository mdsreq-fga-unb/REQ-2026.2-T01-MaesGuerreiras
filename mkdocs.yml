site_name: Mães Guerreiras

theme:
  name: material
  language: pt
  logo: assets/logo.png
  favicon: assets/logo.png

  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Modo escuro
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Modo claro

  font:
    text: Inter
    code: JetBrains Mono

  features:
    - navigation.tabs
    - navigation.top
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy

extra_css:
  - assets/stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      title: Nesta página
  - tables

plugins:
  - search:
      lang: pt

nav:
  - Home: index.md
  - "Evolução da Proposta": 00-evolucao/index.md
  - "Evidências e Gravações": 00-evidencias/index.md
  - "Atas de Reunião": 00-atas/index.md
  - "Documentação":
    - "1·Cenário": 01-cenario/index.md
    - "2·Solução": 02-solucao/index.md
    - "3·Intervenção Social": 03-intervencao-social/index.md
    - "4·Estratégias": 04-estrategias/index.md
    - "5·ER": 05-er/index.md
    - "6·Cronograma": 06-cronograma/index.md
    - "7·Equipe": 07-interacao/index.md
    - "8·Requisitos": 08-requisitos/index.md
    - "9·DoR e DoD": 09-dor-dod/index.md
    - "10·Backlog de Produto": 10-backlog/index.md
    - "11·Lições Aprendidas": 08-licoes/index.md
    - "12·Referências": 12-referencias/index.md
