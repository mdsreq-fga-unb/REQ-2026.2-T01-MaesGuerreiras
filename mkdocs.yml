site_name: Mães Guerreiras

theme:
  name: material
  language: pt
  logo: assets/logo.png
  favicon: assets/logo.png

  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Modo escuro
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Modo claro

  font:
    text: Inter
    code: JetBrains Mono

  features:
    - navigation.tabs
    - navigation.top
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy

extra_css:
  - assets/stylesheets/extra.css
  - assets/stylesheets/catalogo.css

extra_javascript:
  - assets/javascripts/catalogo.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      title: Nesta página
  - tables

plugins:
  - search:
      lang: pt

nav:
  - Home: index.md
  - "Visão do Produto": 01-visao-produto/index.md
  - "Evolução da Proposta": 00-evolucao/index.md
  - "Evidências e Gravações": 00-evidencias/index.md
  - "Atas de Reunião": 00-atas/index.md
  - "Requisitos":
    - "8·Catálogo integrado": 08-requisitos/index.md
    - "8.1·RNFs": 08-requisitos/rnf.md
    - "8.2·Regras de negócio": 08-requisitos/regras.md
    - "8.3·Glossário e perfis": 08-requisitos/glossario.md
    - "9·Priorização": 09-priorizacao/index.md
    - "10·MVP": 10-mvp/index.md
    - "11·Rastreabilidade": 11-rastreabilidade/index.md
    - "12·Mapa de histórias": 12-mapa/index.md
  - "Qualidade e memória":
    - "13·DoR e DoD": 13-dor-dod/index.md
    - "14·Histórico de evolução": 14-historico/index.md
    - "15·Lições Aprendidas": 15-licoes/index.md
    - "16·Referências": 16-referencias/index.md
