<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="Diagrama de estados da chamada e do registro de frequência"><title>Diagrama de estados da chamada e do registro de frequência</title><style>
text{font-family:Inter,"Segoe UI",Helvetica,Arial,sans-serif;fill:#241a2e}
.n{fill:#fff;stroke:#241a2e;stroke-width:1.3}.c{fill:#efe4f8;stroke:#6b2fa0;stroke-width:1.6}
.x{fill:#fbf1dc;stroke:#b7791f;stroke-width:1.3}.d{fill:#fff;stroke:#241a2e;stroke-width:1.2;stroke-dasharray:5 4}
.a{stroke:#241a2e;stroke-width:1.3}.t{font-size:12.5px;font-weight:600}.s{font-size:11px;fill:#4d4259}
.l{font-size:11px;fill:#4d4259}.h{font-size:13px;font-weight:700}
</style><defs><marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#241a2e"/></marker></defs><rect width="760" height="340" fill="#fff"/><text class="h" x="20" y="24">Chamada de um encontro</text><circle cx="22" cy="92" r="6" fill="#241a2e"/><line class="a" x1="28" y1="92" x2="50" y2="92" marker-end="url(#seta)"/><rect class="n" x="50" y="70" width="110" height="44" rx="22"/><text class="t" x="105.0" y="96.0" text-anchor="middle">Sem chamada</text><rect class="c" x="240" y="70" width="110" height="44" rx="22"/><text class="t" x="295.0" y="96.0" text-anchor="middle">Aberta</text><rect class="n" x="430" y="70" width="110" height="44" rx="22"/><text class="t" x="485.0" y="96.0" text-anchor="middle">Concluída</text><rect class="n" x="620" y="70" width="110" height="44" rx="22"/><text class="t" x="675.0" y="96.0" text-anchor="middle">Corrigida</text><line class="a" x1="160" y1="92" x2="240" y2="92" marker-end="url(#seta)"/><text class="l" x="200" y="46" text-anchor="middle">abrir</text><text class="l" x="200" y="59" text-anchor="middle">[é a data do encontro]</text><line class="a" x1="350" y1="92" x2="430" y2="92" marker-end="url(#seta)"/><text class="l" x="390" y="46" text-anchor="middle">concluir</text><text class="l" x="390" y="59" text-anchor="middle">[frequência registrada]</text><line class="a" x1="540" y1="92" x2="620" y2="92" marker-end="url(#seta)"/><text class="l" x="580" y="46" text-anchor="middle">corrigir</text><text class="l" x="580" y="59" text-anchor="middle">[quem pode: ver abaixo]</text><text class="l" x="105" y="134" text-anchor="middle">fora da data, a abertura</text><text class="l" x="105" y="147" text-anchor="middle">é recusada (RN15)</text><text class="l" x="580" y="134" text-anchor="middle">a Voluntária corrige a chamada que fez, até o fim do dia;</text><text class="l" x="580" y="147" text-anchor="middle">depois, só a Coordenação, com motivo. O registro</text><text class="l" x="580" y="160" text-anchor="middle">anterior é sempre preservado (RN17)</text><text class="h" x="20" y="214">Registro de cada participante na chamada</text><rect class="n" x="50" y="244" width="110" height="44" rx="22"/><text class="t" x="105.0" y="270.0" text-anchor="middle">Presente</text><rect class="n" x="240" y="244" width="110" height="44" rx="22"/><text class="t" x="295.0" y="270.0" text-anchor="middle">Falta</text><rect class="c" x="450" y="244" width="150" height="44" rx="22"/><text class="t" x="525.0" y="270.0" text-anchor="middle">Falta justificada</text><line class="a" x1="160" y1="266" x2="240" y2="266" marker-end="url(#seta)" marker-start="url(#seta)"/><text class="l" x="200" y="236" text-anchor="middle">corrigir (RN17)</text><line class="a" x1="350" y1="266" x2="450" y2="266" marker-end="url(#seta)"/><text class="l" x="400" y="224" text-anchor="middle">justificar</text><text class="l" x="400" y="237" text-anchor="middle">[motivo informado]</text><text class="l" x="525" y="308" text-anchor="middle">continua sendo falta, mas não conta para</text><text class="l" x="525" y="321" text-anchor="middle">o limite de faltas seguidas (RN16)</text></svg>