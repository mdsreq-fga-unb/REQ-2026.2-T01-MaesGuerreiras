<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 424" width="760" height="424" role="img" aria-label="Diagrama de contexto do sistema Mães Guerreiras"><title>Diagrama de contexto do sistema Mães Guerreiras</title><style>
text{font-family:Inter,"Segoe UI",Helvetica,Arial,sans-serif;fill:#241a2e}
.n{fill:#fff;stroke:#241a2e;stroke-width:1.3}.c{fill:#efe4f8;stroke:#6b2fa0;stroke-width:1.6}
.x{fill:#fbf1dc;stroke:#b7791f;stroke-width:1.3}.d{fill:#fff;stroke:#241a2e;stroke-width:1.2;stroke-dasharray:5 4}
.a{stroke:#241a2e;stroke-width:1.3}.t{font-size:12.5px;font-weight:600}.s{font-size:11px;fill:#4d4259}
.l{font-size:11px;fill:#4d4259}.h{font-size:13px;font-weight:700}
</style><defs><marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#241a2e"/></marker></defs><rect width="760" height="424" fill="#fff"/><rect class="c" x="290" y="150" width="190" height="120" rx="8"/><text class="t" x="385.0" y="207.0" text-anchor="middle">Sistema Mães Guerreiras</text><text class="s" x="385.0" y="222.0" text-anchor="middle">área restrita (MVP)</text><rect class="n" x="20" y="84" width="190" height="56" rx="8"/><text class="t" x="115.0" y="109.0" text-anchor="middle">Coordenação</text><text class="s" x="115.0" y="124.0" text-anchor="middle">perfil Coordenação</text><line class="a" x1="210" y1="112" x2="290" y2="180" marker-end="url(#seta)"/><text class="l" x="20" y="158" text-anchor="start">cadastra usuários, perfis e turmas;</text><text class="l" x="20" y="171" text-anchor="start">faz também tudo o que a Voluntária faz</text><rect class="n" x="20" y="250" width="190" height="56" rx="8"/><text class="t" x="115.0" y="275.0" text-anchor="middle">Voluntária</text><text class="s" x="115.0" y="290.0" text-anchor="middle">perfil Voluntário</text><line class="a" x1="210" y1="278" x2="290" y2="240" marker-end="url(#seta)"/><text class="l" x="20" y="324" text-anchor="start">registra doações, famílias, participantes,</text><text class="l" x="20" y="337" text-anchor="start">inscrições e a chamada (inclui a educadora)</text><rect class="x" x="570" y="110" width="170" height="56" rx="8"/><text class="t" x="655.0" y="135.0" text-anchor="middle">Supabase</text><text class="s" x="655.0" y="150.0" text-anchor="middle">banco de dados e login</text><rect class="x" x="570" y="254" width="170" height="56" rx="8"/><text class="t" x="655.0" y="279.0" text-anchor="middle">Vercel</text><text class="s" x="655.0" y="294.0" text-anchor="middle">hospedagem sem custo</text><line class="a" x1="480" y1="190" x2="570" y2="140" marker-end="url(#seta)"/><text class="l" x="560" y="128" text-anchor="end">dados e autenticação</text><line class="a" x1="480" y1="232" x2="570" y2="280" marker-end="url(#seta)"/><text class="l" x="514" y="284" text-anchor="middle">publicação</text><rect class="d" x="300" y="20" width="170" height="52" rx="8"/><text class="t" x="385.0" y="43.0" text-anchor="middle">Visitante</text><text class="s" x="385.0" y="58.0" text-anchor="middle">portal e agenda pública</text><line class="a" x1="385" y1="72" x2="385" y2="150" stroke-dasharray="5 4" marker-end="url(#seta)"/><text class="l" x="392" y="114" text-anchor="start">fora do MVP</text><rect class="d" x="196" y="356" width="196" height="52" rx="8"/><text class="t" x="294.0" y="379.0" text-anchor="middle">Famílias e doadores</text><text class="s" x="294.0" y="394.0" text-anchor="middle">dados registrados; não acessam</text><rect class="d" x="412" y="356" width="170" height="52" rx="8"/><text class="t" x="497.0" y="379.0" text-anchor="middle">Parceiros institucionais</text><text class="s" x="497.0" y="394.0" text-anchor="middle">não acessam</text><line class="a" x1="310" y1="356" x2="350" y2="270" stroke-dasharray="5 4" marker-end="url(#seta)"/><line class="a" x1="430" y1="270" x2="480" y2="356" stroke-dasharray="5 4" marker-end="url(#seta)"/><text class="l" x="472" y="310" text-anchor="start">relatórios</text><text class="l" x="472" y="323" text-anchor="start">(fora do MVP)</text></svg>